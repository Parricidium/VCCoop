; VCCoop - reglages. Le menu COOP du jeu (ou les raccourcis Heberger / Rejoindre) choisit le role.
[VCCoop]
; Nom affiche aux autres joueurs
Pseudo=Tommy
; hote = heberge la partie (joue les missions) ; invite = rejoint l'hote
Role=hote
; Invite : adresse IP de l'hote (Radmin VPN, ZeroTier, Hamachi, ou IP publique si le port est ouvert)
Adresse=127.0.0.1
; Port UDP (l'hote doit le laisser entrer : pare-feu / redirection de port)
Port=7790
; 0 = plein ecran d'origine, 1 = fenetre (1280x720), 2 = plein ecran fenetre a la resolution du bureau (conseille)
Fenetre=2
; 1 = image et interface au vrai format de l'ecran (16:9, 21:9, 32:9) ; 0 = comme le jeu d'origine (4:3 etire)
GrandEcran=1
; Position de la fenetre (Fenetre=1)
FenetreX=40
FenetreY=40
; Limite d'images par seconde. 30 = comme le jeu d'origine (conseille ; pour plus de fluidite, un outil de
; generation d'images comme Lossless Scaling marche bien). Au-dessus de 30, bogues du jeu d'origine : par
; exemple, a 60, on n'arrive parfois plus a monter dans les vehicules.
ImagesParSeconde=30
; 1 = pas de videos Rockstar au demarrage
SansIntro=1
; 1 = reglages et sauvegardes dans le dossier du jeu (a part du solo)
SauvegardesLocales=1
; Hote : 1 = les joueurs peuvent se blesser entre eux (coups, balles, voiture) ; 0 = non
TirAmi=1
; 1 = charge les mods .asi du dossier du jeu, de scripts et de plugins
ChargerASI=1
; 1 = pseudo des autres joueurs au-dessus de leur tete
AfficherPseudos=1
; Tenue choisie avec F7 (vide = celle du jeu)
Tenue=
; Hote : 1 = l'argent donne par les missions va aussi aux invites
ArgentPartage=1
; 1 = etoiles de police communes a tous les joueurs
RecherchePartagee=1
; Invite : 1 = garde ses armes et son argent apres une mort ou une arrestation
GarderArmes=1
; Invite : 1 = reapparait pres de l'hote au lieu de l'hopital (0 conseille)
ReapparitionHote=0
; 1 = camera a la souris autour du vehicule, visee au clic droit (comme GTA V)
CameraLibre=1
; Sensibilite de cette camera, en %
SensibiliteCamera=100
; Distance d'affichage en % (details, passants, vehicules) : 100 = jeu d'origine, jusqu'a 400
DistanceAffichage=200
; Options video (menu COOP > Options > Options video). Anticrenelage : 0, 2, 4 ou 8 (pris au lancement du jeu) ;
; filtrage anisotrope 16x et trilineaire : textures nettes au loin. 0 partout = rendu d'origine.
Anticrenelage=4
FiltrageAnisotrope=1
; Ombres du soleil (carte d'ombre calculee chaque image, 250 m autour de la camera) : batiments, palmiers,
; vehicules et personnages projettent une vraie ombre selon l'heure, qui apparait avec l'aube. 0 = ombres d'origine.
OmbresSoleil=1
; Finesse de la carte d'ombre : 4096 (net) ou 2048 (plus leger)
OmbresResolution=4096
; Texte des menus : 1 = couleur et contour ci-dessous ; 0 = rose d'origine
StyleMenus=1
; Couleur du texte et de son contour (rouge,vert,bleu de 0 a 255)
CouleurTexteMenus=27,27,27
CouleurContourMenus=255,150,225
; Couleur de la barre de selection des menus (vert d'origine : 25,130,70)
CouleurSelectionMenus=245,245,245
; Pages des sauvegardes (charger, sauvegarder, supprimer) : couleur du texte et de la selection
CouleurTexteSauvegardes=255,255,255
CouleurSelectionSauvegardes=255,150,225
; Taille du texte des menus en % (100 = jeu d'origine ; plus petit = plus net)
TailleTexteMenus=80
; 1 = mods partages : les fichiers de VCCoop\mods (modeles .dff/.txd, handling.cfg, carcols.dat) remplacent ceux du
; jeu et sont envoyes automatiquement aux invites par l'hote (voir VCCoop\mods\LISEZMOI.txt)
ModsPartages=1
