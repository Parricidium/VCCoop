; VCCoop - reglages. Le menu COOP du jeu (ou les raccourcis Heberger / Rejoindre) choisit le role.
[VCCoop]
; Pseudo, Adresse, Port et Tenue : au premier lancement, recopies dans vccoop-joueur.ini, qui fait foi ensuite
; (garde aux mises a jour ; le menu COOP y ecrit). Nom affiche aux autres joueurs :
Pseudo=Tommy
; hote = heberge la partie (joue les missions) ; invite = rejoint l'hote
Role=hote
; Invite : adresse IP de l'hote (Radmin VPN, ZeroTier, Hamachi, ou IP publique si le port est ouvert)
Adresse=127.0.0.1
; Port UDP (l'hote doit le laisser entrer : pare-feu / redirection de port)
Port=7790
; 0 = plein ecran d'origine, 1 = fenetre (1280x720), 2 = plein ecran fenetre a la resolution du bureau (conseille)
Fenetre=2
; 1 = image et interface au vrai format de l'ecran (16:9, 21:9, 32:9) ; 0 = comme le jeu d'origine (4:3 etire)
GrandEcran=1
; Position de la fenetre (Fenetre=1)
FenetreX=40
FenetreY=40
; Taille de la fenetre (Fenetre=1), si l'ecran propose ce mode : 1280x720, 1600x900, 1920x1080...
TailleFenetre=1280x720
; Limite d'images par seconde. 30 = comme le jeu d'origine (conseille ; pour plus de fluidite, un outil de
; generation d'images comme Lossless Scaling marche bien). Au-dessus de 30, bogues du jeu d'origine : par
; exemple, a 60, on n'arrive parfois plus a monter dans les vehicules.
ImagesParSeconde=30
; 1 = pas de videos Rockstar au demarrage
SansIntro=1
; 1 = reglages et sauvegardes dans le dossier du jeu (a part du solo)
SauvegardesLocales=1
; Hote : 1 = les joueurs peuvent se blesser entre eux (coups, balles, voiture) ; 0 = non
TirAmi=1
; 1 = charge les mods .asi du dossier du jeu, de scripts et de plugins
ChargerASI=1
; 1 = pseudo des autres joueurs au-dessus de leur tete
AfficherPseudos=1
; Tenue choisie avec F7 (vide = celle du jeu)
Tenue=
; Hote : 1 = l'argent donne par les missions va aussi aux invites
ArgentPartage=1
; Etoiles de police : 0 = chacun les siennes (la police ne poursuit que le joueur recherche, les autres la voient) ;
; 1 = etoiles communes a tous les joueurs
RecherchePartagee=0
; 1 = pres de l'hote, seule la police de l'hote existe et elle poursuit aussi les invites recherches
PoliceHote=1
; Invite : 1 = garde ses armes et son argent apres une mort ou une arrestation
GarderArmes=1
; Invite : 1 = reapparait pres de l'hote au lieu de l'hopital (0 conseille)
ReapparitionHote=0
; 1 = camera a la souris autour du vehicule, visee au clic droit (comme GTA V)
CameraLibre=1
; Sensibilite de cette camera, en %
SensibiliteCamera=100
; Vue a la premiere personne (depuis la tete de Tommy, a pied et en vehicule) : la touche ToucheVue l'active ou la
; coupe (F1..F12 ou une lettre). 0 = touche sans effet.
VuePremierePersonne=1
ToucheVue=F6
; Menu en jeu (souris) : joueurs, et pour les admins vehicules, outils, monde. Tchat : T, Entree pour envoyer.
ToucheMenuJeu=F10
ToucheTchat=T
; Hote : pseudos des admins du menu en jeu, separes par des virgules (le bouton ADMIN du menu les ajoute)
AdminsJeu=
; Distance d'affichage en % (details, passants, vehicules) : 100 = jeu d'origine, jusqu'a 400
DistanceAffichage=200
; Population (reglages de l'hote, envoyes aux invites ; aussi dans le menu COOP > Options > Options coop) : passants et voitures naissent plus loin et
; restent tant qu'on est dans la zone, qu'on les regarde ou non (en %, 100 a 200)
ZonePopulation=150
; Nombre de passants et de voitures en meme temps (en %, 50 a 300 ; 100 = jeu d'origine). Les reserves du jeu sont
; doublees (280 personnages, 220 vehicules) pour leur faire de la place.
DensitePopulation=150
; Corps mous : un personnage tue, ou percute par un vehicule, s'effondre et roule comme un vrai corps
; (pose calculee par le proprietaire du personnage, la meme chez tout le monde). 0 = animations d'origine.
CorpsMous=1
; Options video (menu COOP > Options > Options video). Anticrenelage : 0, 2, 4 ou 8 (pris au lancement du jeu) ;
; filtrage anisotrope 16x et trilineaire : textures nettes au loin. 0 partout = rendu d'origine.
Anticrenelage=4
FiltrageAnisotrope=1
; Rendu moderne : 9 = le jeu passe par Direct3D 9 (pont integre a VCCoop, rien a installer), ce qui permet les
; ombres modernes ci-dessous ; 8 = Direct3D 8 d'origine (en cas de souci). Pris au lancement du jeu.
Rendu=9
; Ombres du soleil : batiments, palmiers, vehicules et personnages projettent une ombre douce qui suit le soleil
; et la meteo du jeu, jusqu'a ~220 m, sans clignotement (y compris les batiments hors du champ). 0 = ombres d'origine.
OmbresSoleil=1
; Qualite des ombres : 2048 (moyenne), 4096 (haute, conseille), 8192 (ultra, carte graphique recente)
OmbresResolution=4096
; Eau moderne (rendu moderne) : turquoise selon la profondeur, fond visible a travers, reflets du ciel et du soleil,
; vagues et ecume sur les rives. 0 = eau d'origine.
EauModerne=1
; Reflets sur l'eau (avec l'eau moderne) : les quais, bateaux, palmiers et immeubles se refletent dans l'eau.
; 0 = seulement le ciel (un peu plus rapide).
RefletsEau=1
; Lumieres dynamiques (rendu moderne) : lampadaires, neons, phares, explosions et tirs eclairent le decor par pixel.
LumieresDynamiques=1
; Ombres des lumieres : nombre de lumieres proches (0 a 4 : lampadaires, phares...) qui projettent une ombre
OmbresLumieres=4
; 1 = la lune (visible de 0 h a 6 h) projette des ombres, plus faibles que le soleil
OmbresLune=1
; Occlusion ambiante (rendu moderne) : coins, pieds des murs et des arbres, dessous des voitures un peu assombris.
OcclusionAmbiante=1
; Effets d'image (menu Options video > Effets d'image) : SMAA (bords en escalier lisses), Eclat (neons, soleil,
; phares debordent en lumiere douce), Etalonnage 0 Original / 1 Vice (couleurs "Miami 80") / 2 Film, Nettete 0 a 100.
SMAA=1
Eclat=1
Etalonnage=1
Nettete=40
; Ambiance (menu Options video > Ambiance) : reverberes, neons et enseignes eclairent vraiment la rue la nuit (leur
; tache peinte au sol est retiree), phare d'Ocean Beach : vraie lumiere tournante et faisceau doux a la place du cone ;
; fumee et explosions sans coupure nette contre le decor.
LampadairesEclairent=1
ParticulesDouces=1
; Routes mouillees sous la pluie (reflets des neons et des phares, flaques) et sols brillants des interieurs ;
; rayons de soleil ; palmiers et arbres au vent ; faisceaux des phares dans la pluie et le brouillard ;
; brume au loin qui suit l'heure ; reflets sur les carrosseries ; lumiere indirecte (couleur renvoyee).
RoutesMouillees=1
RayonsSoleil=1
VegetationVent=1
FaisceauxPhares=1
Brume=1
RefletsVoitures=1
LumiereIndirecte=1
; Texte des menus : 1 = couleur et contour ci-dessous ; 0 = rose d'origine
StyleMenus=1
; Couleur du texte et de son contour (rouge,vert,bleu de 0 a 255)
CouleurTexteMenus=27,27,27
CouleurContourMenus=255,150,225
; Couleur de la barre de selection des menus (vert d'origine : 25,130,70)
CouleurSelectionMenus=245,245,245
; Pages des sauvegardes (charger, sauvegarder, supprimer) : couleur du texte et de la selection
CouleurTexteSauvegardes=255,255,255
CouleurSelectionSauvegardes=255,150,225
; Taille du texte des menus en % (100 = jeu d'origine ; plus petit = plus net)
TailleTexteMenus=80
; 1 = mods partages : les fichiers de VCCoop\mods (modeles .dff/.txd, handling.cfg, carcols.dat) remplacent ceux du
; jeu et sont envoyes automatiquement aux invites par l'hote (voir VCCoop\mods\LISEZMOI.txt)
ModsPartages=1
